# apps/redis/dev-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-dev
  namespace: argocd
spec:
  project: default
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 19.5.1   # 최신 stable 버전 (2025년 기준)
    helm:
      valueFiles:
        - helm/redis/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
