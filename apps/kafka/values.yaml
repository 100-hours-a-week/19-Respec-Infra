kafka:
  enableKraft: false

kraft:
  enabled: false

controller:
  replicaCount: 0

zookeeper:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
  auth:
    enabled: false

broker:
  replicaCount: 3

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: broker
          topologyKey: "topology.kubernetes.io/zone"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-northeast-2a
                  - ap-northeast-2b

  config: |
    listeners=PLAINTEXT://:9092
    advertised.listeners=PLAINTEXT://$(POD_NAME).kafka-broker-headless.kafka.svc.cluster.local:9092
    log.retention.hours=168
    zookeeper.connect=kafka-zookeeper-headless:2181

  extraEnvVars:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name

persistence:
  enabled: true
  ## 중요: StorageClass가 EBS이고, WaitForFirstConsumer인 클래스 사용
  storageClass: gp2-csi  # 또는 gp3-csi 등 WaitForFirstConsumer 바인딩 모드 확인

auth:
  clientProtocol: plaintext
  interBrokerProtocol: plaintext
  existingSecret: kafka-user-passwords
  clientUsers:
    - dummy
  clientPasswords:
    - dummy
  interBrokerUser: dummy
  interBrokerPassword: dummy
