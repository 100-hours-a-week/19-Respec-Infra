kafka:
  enableKraft: false

kraft:
  enabled: false

controller:
  replicaCount: 0

zookeeper:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
  auth:
    enabled: false

broker:
  replicaCount: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-northeast-2c
  configurationConfigMap: ""  
  configOverrides:
    server:
      - listeners=PLAINTEXT://:9092
      - advertised.listeners=PLAINTEXT://$(POD_NAME).kafka-broker-headless.kafka.svc.cluster.local:9092
      - listener.security.protocol.map=PLAINTEXT:PLAINTEXT
      - security.inter.broker.protocol=PLAINTEXT
      - inter.broker.listener.name=PLAINTEXT

  extraEnvVars:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
  existingSecret: ""
  interBrokerUser: ""
  interBrokerPassword: ""
  clientUser: ""
  clientPassword: ""

auth:
  enabled: false

sasl:
  enabled: false
  enabledMechanisms: "PLAIN"              # dummy 값
  interBrokerMechanism: "PLAIN"           # dummy 값
  controllerMechanism: "PLAIN"            # dummy 값
  client:
    users: ["dummy"]                      # dummy 값
    passwords: ["dummy"]                  # dummy 값

listeners:
  client:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT

persistence:
  enabled: true
  storageClass: kafka-gp2-wffc
