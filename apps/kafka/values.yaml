kafka:
  enableKraft: false

kraft:
  enabled: false

controller:
  replicaCount: 0

zookeeper:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
  auth:
    enabled: false



broker:
  replicaCount: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-northeast-2c
  configurationConfigMap: ""  
  configOverrides:
    server:
      - listeners=PLAINTEXT://:9092
      - advertised.listeners=PLAINTEXT://$(POD_NAME).kafka-broker-headless.kafka.svc.cluster.local:9092
      - listener.security.protocol.map=PLAINTEXT:PLAINTEXT
      - security.inter.broker.protocol=PLAINTEXT
      - inter.broker.listener.name=PLAINTEXT

  extraEnvVars:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name

auth:
  enabled: true       # 중요: false면 configOverrides 무시됨
  sasl:
    scram:
      enabled: false
  clientProtocol: plaintext
  interBrokerProtocol: plaintext
  interBrokerListenerName: PLAINTEXT          

persistence:
  enabled: true
  storageClass: kafka-gp2-wffc
