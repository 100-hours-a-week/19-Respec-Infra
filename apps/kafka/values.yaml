# Kraft 비활성화
kafka:
  enableKraft: false

kraft:
  enabled: false   # 이건 없어도 되지만, chart 내부에서 두 키가 분리되어 있다면 유지

# Zookeeper 설정
zookeeper:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
  auth:
    enabled: false  # Zookeeper 자체 인증 비활성화

# Kafka 인증 설정 (중앙 통제)
auth:
  enabled: false
  zookeeper:
    enabled: false  # Kafka → Zookeeper 인증도 비활성화

sasl:
  enabled: false
  enabledMechanisms: ""
  interBrokerMechanism: ""
  controllerMechanism: ""
  client:
    users: []

broker:
  replicaCount: 1

  extraEnvVars:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: PLAINTEXT://$(POD_NAME).kafka-broker-headless.kafka.svc.cluster.local:9092
    - name: KAFKA_CFG_LISTENERS
      value: PLAINTEXT://:9092
    - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
      value: PLAINTEXT:PLAINTEXT
    - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
      value: PLAINTEXT
    - name: KAFKA_CFG_ZOOKEEPER_CONNECT
      value: kafka-zookeeper-headless.kafka.svc.cluster.local:2181

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-northeast-2c

  configurationConfigMap: ""         # ✅ 유지 가능
  configOverrides: {}                # ✅ 이 줄 생략해도 되지만 빈 map으로 명시해도 안전

  existingSecret: ""
  interBrokerUser: ""
  interBrokerPassword: ""
  clientUser: ""



  existingSecret: ""
  interBrokerUser: ""
  interBrokerPassword: ""
  clientUser: ""
  clientPassword: ""

# 저장소 설정
persistence:
  enabled: true
  storageClass: kafka-gp2-wffc
