kafka:
  enableKraft: false

kraft:
  enabled: false

controller:
  replicaCount: 0

zookeeper:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
  auth:
    enabled: false

broker:
  replicaCount: 1

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-northeast-2c

  # config: |
  #   listeners=PLAINTEXT://:9092
  #   advertised.listeners=PLAINTEXT://$(POD_NAME).kafka-broker-headless.kafka.svc.cluster.local:9092
  #   log.retention.hours=168
  #   zookeeper.connect=kafka-zookeeper-headless:2181
  configOverrides:
    server:
      - listeners=PLAINTEXT://:9092
      - advertised.listeners=PLAINTEXT://$(POD_NAME).kafka-broker-headless.kafka.svc.cluster.local:9092
      - log.retention.hours=168
      - zookeeper.connect=kafka-zookeeper-headless:2181

  extraEnvVars:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: KAFKA_ZOOKEEPER_BOOTSTRAP_SCRAM_USERS
      value: "false"

persistence:
  enabled: true
  storageClass: kafka-gp2-wffc

auth:
  enabled: false
  existingSecret: ""
  clientUsers: []
  clientPasswords: []
  interBrokerUser: ""
  interBrokerPassword: ""
  sasl:
    scram:
      enabled: false
  clientProtocol: plaintext
  interBrokerProtocol: plaintext
  interBrokerListenerName: PLAINTEXT
