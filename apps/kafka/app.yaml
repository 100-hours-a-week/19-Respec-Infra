apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-dev
  namespace: argocd
spec:
  project: default
  source:
    chart: kafka
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 26.5.2  # chart 버전 (bitnami/kafka)
    helm:
      valueFiles:
        - helm/kafka/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
