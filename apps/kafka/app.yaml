apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd   # ArgoCD가 설치된 네임스페이스
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-Respec-Infra.git
    targetRevision: prod
    path: apps/kafka           # Git에서 Kafka values.yaml이 있는 경로
    chart: kafka               # 사용하려는 Helm chart 이름
    helm:
      releaseName: kafka
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka           # Kafka가 배포될 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
