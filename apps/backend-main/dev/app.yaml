apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-main-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-Respec-Infra.git
    targetRevision: prod
    path: helm/backend-main
    helm:
      valueFiles:
        - values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: backend-main       # 배포 대상 네임스페이스
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true     # ✅ 바로 이 한 줄!
