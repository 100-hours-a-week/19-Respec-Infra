replicaCount: 2

image:
  repository: 115313776476.dkr.ecr.ap-northeast-2.amazonaws.com/chatconsumer-backend-dev
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-secret
# 이건 둘 다 바꿔야할 듯
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: dev
