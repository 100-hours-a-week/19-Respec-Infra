apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
  namespace: backend-main
spec:
  schedule: "0 */6 * * *"  # 6시간마다 실행
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-refresh-sa
          containers:
            - name: ecr-login
              image: amazon/aws-cli:2.13.9
              command:
                - /bin/sh
                - -c
                - |
                  aws ecr get-login-password --region ap-northeast-2 | \
                  kubectl create secret docker-registry ecr-secret \
                    --docker-server=115313776476.dkr.ecr.ap-northeast-2.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$(cat -)" \
                    --namespace=backend-main \
                    --dry-run=client -o yaml | kubectl apply -f -
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials-secret
                      key: awsAccessKey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials-secret
                      key: awsSecretAccessKey

          restartPolicy: OnFailure
