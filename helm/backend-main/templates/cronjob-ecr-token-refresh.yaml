apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
  namespace: backend-main
spec:
  schedule: "0 */6 * * *"  # 6시간마다 실행
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-refresh-sa
          containers:
            - name: ecr-login
              image: amazon/aws-cli:2.13.9
              command:
                - /bin/sh
                - -c
                - |
                  aws ecr get-login-password --region ap-northeast-2 | \
                  docker login --username AWS --password-stdin 115313776476.dkr.ecr.ap-northeast-2.amazonaws.com
          restartPolicy: OnFailure
