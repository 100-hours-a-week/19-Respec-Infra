replicaCount: 2

image:
  repository: 115313776476.dkr.ecr.ap-northeast-2.amazonaws.com/specranking-backend-dev
  tag: dev-21cc78e
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-secret


service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/group.name: specranking-apps
  hosts:
    - host: dev.specranking.net
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

