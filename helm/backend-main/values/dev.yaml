replicaCount: 1

image:
  repository: 115313776476.dkr.ecr.ap-northeast-2.amazonaws.com/specranking-backend-dev
  tag: dev-b9a6591
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-secret


service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:115313776476:certificate/25a254b7-38c9-4654-9da7-112f0de38ffc
    alb.ingress.kubernetes.io/group.name: specranking-apps

  hosts:
    - host: api.dev.specranking.net
      paths:
        - path: /ws/chat
          pathType: Prefix
          backend:
            service:
              name: backend-main
              port:
                number: 80
                
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-main
              port:
                number: 80

  tls:
    - hosts:
        - dev.specranking.net

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
# env:
