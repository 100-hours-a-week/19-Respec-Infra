name: Sync Helm Values for ArgoCD

on:
  workflow_dispatch:   # 수동 실행도 가능하게 함
  push:
    branches:
      - prod           # Infra 레포의 prod 브랜치 push 시 작동

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v3

      - name: Values.yaml 수정됨 확인 또는 필요 시 변경 로직 삽입
        run: echo "ArgoCD가 이 변경을 감지하여 자동 배포할 예정입니다."

      - name: Validate all YAML files
        run: |
          find . -name '*.yaml' -print0 | xargs -0 yamllint -d relaxed

      - name: Print changed values.yaml
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'values.yaml' || true
