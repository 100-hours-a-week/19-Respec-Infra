name: Sync Helm Values for ArgoCD

on:
  workflow_dispatch:   # 수동 실행도 가능하게 함
  push:
    branches:
      - prod           # Infra 레포의 prod 브랜치 push 시 작동

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v3

      # 필요시 Helm 검증 도구 넣을 수도 있음 (옵션)

      - name: ✅ Values.yaml 수정됨 확인 또는 필요 시 변경 로직 삽입
        run: echo "ArgoCD가 이 변경을 감지하여 자동 배포할 예정입니다."

      # 여기서 helm 명령어는 ❌ 제거!
